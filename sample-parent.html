<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>ててまる 保護者ホーム</title>
<link rel="stylesheet" href="styles.css">
<script src="data.js"></script><script src="trial-data.js"></script>
</head>
<body>
<div class="phone">

  <header class="header">
    <div class="header-row header-top">
      <div class="status-row">
        <span class="status-dot" aria-hidden="true"></span>
        <span class="status-text">タイマーのお試し記録</span>
      </div>
      <a class="switch-link pressable" href="timer.html">
        こども画面へ
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 6 15 12 9 18"/></svg>
      </a>
    </div>
    <div class="header-row">
      <div>
        <h1 class="header-title kanji-text">保護者ホーム</h1>
        <span class="header-sub">
          <svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="18" height="12" rx="2"/><line x1="22" y1="11" x2="22" y2="15"/></svg>
          サンプルと、この端末で試した学習
        </span>
      </div>
      <div class="avatar" aria-hidden="true">
        <img width="42" height="42" style="object-fit:contain" src="./friend-front.png" alt="">
      </div>
    </div>
  </header>

  <div class="level-picker-row">
    <span class="level-picker-label">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7V4h16v3"/><path d="M9 20h6"/><path d="M12 4v16"/></svg>
      かんじ レベル
    </span>
    <div class="level-picker" id="levelPicker">
      <button class="level-btn" data-level="1">1年</button>
      <button class="level-btn" data-level="2">2年</button>
      <button class="level-btn active" data-level="3">3年</button>
      <button class="level-btn" data-level="6">ぜんぶ</button>
    </div>
  </div>

  <main class="content">

    <!-- 今日の学習 -->
    <section>
      <h2 class="section-title kanji-text">今日の学習</h2>
      <div class="section-body">
        <div class="stat-row">
          <div class="card stat-card">
            <span class="stat-head">
              <span class="stat-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2"/><path d="M9 2h6"/></svg></span>
              <span class="stat-label kanji-text">学習時間</span>
            </span>
            <span class="stat-value">25<span class="stat-unit">分</span></span>
          </div>
          <div class="card stat-card">
            <span class="stat-head">
              <span class="stat-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></span>
              <span class="stat-label kanji-text">学習した回数</span>
            </span>
            <span class="stat-value">8<span class="stat-unit">問</span></span>
          </div>
        </div>
        <div class="card goal-row">
          <div>
            <div class="goal-label kanji-text">今日の目標</div>
            <div class="goal-value kanji-text">算数を10分</div>
          </div>
          <span class="badge badge-solid">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
            <span class="kanji-text">達成</span>
          </span>
        </div>
      </div>
    </section>

    <!-- 直近7日のようす -->
    <section>
      <div class="chart-top-row">
        <h2 class="section-title kanji-text">直近7日のようす</h2>
        <span class="chart-total"><span class="kanji-text">合計</span> <strong id="weekTotal"></strong></span>
      </div>
      <div class="section-body">
        <div class="card">
          <div class="bars" id="bars"></div>
          <div class="bar-labels" id="barLabels"></div>
          <div class="legend" id="legend"></div>
          <div class="detail-box">
            <div class="detail-top">
              <span class="detail-date" id="detailDate"></span>
              <span class="detail-total" id="detailTotal"></span>
            </div>
            <div class="detail-rows" id="detailRows"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- 質問・振り返り -->
    <section>
      <h2 class="section-title kanji-text">質問・振り返り</h2>
      <div class="section-body" id="questionList"></div>
    </section>

    <!-- 保護者設定 -->
    <section>
      <h2 class="section-title kanji-text">保護者設定</h2>
      <div class="section-body">
        <div class="card">
          <div class="setting-row">
            <label class="setting-label" for="sleep">
              <span class="setting-label-top">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
                おやすみモード
              </span>
              <span class="setting-note">21:00〜7:00は声かけを控える</span>
            </label>
            <span class="switch">
              <input id="sleep" type="checkbox" checked>
              <span class="track"></span><span class="knob"></span>
            </span>
          </div>
          <div class="setting-row">
            <label class="setting-label" for="notif">
              <span class="setting-label-top">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
                <span class="kanji-text">学習の通知</span>
              </span>
              <span class="setting-note">この画面に目標の達成を表示</span>
            </label>
            <span class="switch">
              <input id="notif" type="checkbox" checked>
              <span class="track"></span><span class="knob"></span>
            </span>
          </div>
        </div>
      </div>
    </section>
  </main>

  <nav class="tabbar">
    <a class="tab active" href="sample-parent.html" aria-current="page">
      <span class="tab-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9"/></svg></span>
      ホーム
    </a>
    <a class="tab" href="sample-log.html">
      <span class="tab-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="6" y1="20" x2="6" y2="12"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="18" y1="20" x2="18" y2="14"/></svg></span>
      学習記録
    </a>
  </nav>
</div>

<script>
const currentDay=WEEK_DETAIL.at(-1);
const values=document.querySelectorAll('.stat-value');
values[0].textContent=minLabel(dayTotalMinutes(currentDay));
values[1].textContent=currentDay.sessions.length+'回';
const goalSubject=selectedSubject();
document.querySelector('.goal-value').textContent=goalSubject+'を10分';
const badge=document.querySelector('.goal-row .badge');
badge.textContent=(daySubjectTotals(currentDay)[goalSubject]||0)>=10?'達成':'取り組み中';
for(const id of ['sleep','notif']){
 const el=document.getElementById(id);el.checked=readTrial(id)!=='off';
 el.onchange=()=>writeTrial(id,el.checked?'on':'off');
}
const note=document.getElementById('notif');
function showBadge(){badge.style.visibility=note.checked?'visible':'hidden'}
note.addEventListener('change',showBadge);showBadge();
const totals = WEEK_DETAIL.map((d) => dayTotalMinutes(d));
const maxTotal = Math.max(1, ...totals);
let selected = WEEK_DETAIL.length-1; // 土曜日をデフォルト表示

const barsEl = document.getElementById("bars");
const labelsEl = document.getElementById("barLabels");
const legendEl = document.getElementById("legend");
const detailDateEl = document.getElementById("detailDate");
const detailTotalEl = document.getElementById("detailTotal");
const detailRowsEl = document.getElementById("detailRows");

document.getElementById("weekTotal").textContent = minLabel(totals.reduce((a, b) => a + b, 0));

Object.entries(SUBJECT_COLORS).forEach(([name, color]) => {
  const item = document.createElement("span");
  item.className = "legend-item";
  item.innerHTML = `<span class="dot" style="background:${color}"></span>${annotateFurigana(name)}`;
  legendEl.appendChild(item);
});

const CHEVRON = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 6 15 12 9 18"/></svg>`;

function render() {
  barsEl.innerHTML = "";
  labelsEl.innerHTML = "";
  WEEK_DETAIL.forEach((d, i) => {
    const total = totals[i];
    const subjectTotals = daySubjectTotals(d);
    const btn = document.createElement("button");
    btn.className = "bar-btn";
    btn.setAttribute("aria-label", `${d.date} ${minLabel(total)}`);
    btn.setAttribute("aria-pressed", i === selected ? "true" : "false");

    const value = document.createElement("span");
    value.className = "bar-value";
    value.textContent = minLabel(total);
    btn.appendChild(value);

    // 棒の高さはその週でいちばん長い日を基準にする
    const stack = document.createElement("div");
    stack.className = "bar-stack";
    stack.style.height = (total / maxTotal) * 100 + "%";
    Object.entries(subjectTotals).filter(([, m]) => m > 0).forEach(([name, m]) => {
      const seg = document.createElement("div");
      seg.className = "bar-seg";
      seg.style.height = (m / total) * 100 + "%";
      seg.style.background = SUBJECT_COLORS[name];
      stack.appendChild(seg);
    });
    btn.appendChild(stack);
    btn.addEventListener("click", () => { selected = i; render(); });
    barsEl.appendChild(btn);

    const lab = document.createElement("span");
    lab.textContent = d.label;
    if (i === selected) lab.classList.add("selected");
    labelsEl.appendChild(lab);
  });

  const d = WEEK_DETAIL[selected];
  const total = totals[selected];
  const subjectTotals = daySubjectTotals(d);
  detailDateEl.textContent = `${d.date.slice(5).replace("-", "/")}(${d.weekday.replace("曜日", "")})`;
  detailTotalEl.textContent = minLabel(total);
  detailRowsEl.innerHTML = "";
  Object.entries(subjectTotals).filter(([, m]) => m > 0).forEach(([name, m]) => {
    const row = document.createElement("div");
    row.className = "detail-row";
    row.innerHTML = `<span class="dot" style="background:${SUBJECT_COLORS[name]}"></span><span class="detail-name">${annotateFurigana(name)}</span><span class="detail-min">${minLabel(m)}</span>`;
    detailRowsEl.appendChild(row);
  });
  if (d.breaks.length) {
    const row = document.createElement("div");
    row.className = "detail-row";
    row.innerHTML = `<span class="dot" style="background:var(--rest)"></span><span class="detail-name">${annotateFurigana("休憩")}</span><span class="detail-min">${minLabel(dayBreakMinutes(d))}(${d.breaks.length}回)</span>`;
    detailRowsEl.appendChild(row);
  }
  const more = document.createElement("a");
  more.className = "more-link pressable";
  more.href = `sample-log.html#${d.date}`;
  more.innerHTML = `この日の${annotateFurigana("詳細")}を見る ${CHEVRON}`;
  detailRowsEl.appendChild(more);
  applyKanjiLevel(currentLevel);
}

// ---- 質問・振り返り(アコーディオン) ----
const MASCOT_MINI = '<img class="qa-answer-mascot" width="26" height="26" style="object-fit:contain" src="./friend-front.png" alt="">';

const questionListEl = document.getElementById("questionList");
QUESTIONS.forEach((q) => {
  const wrap = document.createElement("div");
  wrap.className = "card card-flush";

  const btn = document.createElement("button");
  btn.className = "list-item list-item-plain";
  btn.setAttribute("aria-expanded", "false");
  btn.innerHTML = `
    <span class="list-icon" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
    </span>
    <span class="list-text">
      <span class="list-title">${annotateFurigana(q.unit)}(${annotateFurigana(q.subject)})</span>
      <span class="list-sub">
        <span class="tag ${q.reviewed ? "" : "tag-new"}">${q.reviewed ? "見返し済み" : "未確認"}</span>
        ${q.date.slice(5).replace("-", "/")}
      </span>
    </span>
    <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 6 15 12 9 18"/></svg>
  `;

  const panel = document.createElement("div");
  panel.className = "accordion-panel";
  panel.innerHTML = `
    <div class="qa-body">
      <div class="qa-question">${annotateFurigana("質問")}:${annotateFurigana(q.question)}</div>
      <div class="qa-answer">${MASCOT_MINI}<span>${annotateFurigana(q.answer)}</span></div>
    </div>
  `;

  btn.addEventListener("click", () => {
    const open = !wrap.classList.contains("is-open");
    wrap.classList.toggle("is-open", open);
    btn.setAttribute("aria-expanded", String(open));
    panel.style.maxHeight = open ? panel.scrollHeight + "px" : "0";
  });

  wrap.appendChild(btn);
  wrap.appendChild(panel);
  questionListEl.appendChild(wrap);
});

// ---- かんじレベル picker ----
document.querySelectorAll(".kanji-text").forEach((el) => {
  el.innerHTML = annotateFurigana(el.textContent);
});

const levelPickerEl = document.getElementById("levelPicker");
let currentLevel = getKanjiLevel();
levelPickerEl.querySelectorAll(".level-btn").forEach((btn) => {
  btn.classList.toggle("active", Number(btn.dataset.level) === currentLevel);
  btn.addEventListener("click", () => {
    currentLevel = Number(btn.dataset.level);
    setKanjiLevel(currentLevel);
    levelPickerEl.querySelectorAll(".level-btn").forEach((b) => b.classList.toggle("active", b === btn));
  });
});
render();
applyKanjiLevel(currentLevel);
</script>
</body>
</html>
