<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF0EA">
<title>ててまる</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="phone entry">

  <header class="entry-hero">
    <div class="entry-mascot" id="entryMascot">
      <plush-pal data-motion="idle" class="entry-canvas"></plush-pal>
    </div>
    <h1 class="entry-logo">ててまる</h1>
    <p class="entry-tagline">勉強するときも、ひと息つくときも<br>あなたに寄り添う学びの相棒</p>
    <span class="entry-prompt">どちらの画面を開きますか?</span>
  </header>

  <nav class="entry-choices" aria-label="画面の選択">
    <a class="choice-card choice-card-child pressable" href="child.html">
      <span class="choice-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="5"/><path d="M12 13c-4 0-6 2.2-6 5.5V20a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-1.5c0-3.3-2-5.5-6-5.5z"/><path d="M9 8.3c.5.5 1.8.9 3 .9s2.5-.4 3-.9"/></svg>
      </span>
      <span class="choice-text">
        <span class="choice-title">こども画面へ</span>
        <span class="choice-sub">きょうの もくひょう・がんばり・ててまると あそぶ</span>
      </span>
      <svg class="choice-arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 6 15 12 9 18"/></svg>
    </a>

    <a class="choice-card pressable" href="parent.html">
      <span class="choice-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="7" r="3"/><path d="M2 21v-2a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v2"/><circle cx="18" cy="8" r="2.2"/><path d="M15.5 21v-1.5a3.5 3.5 0 0 1 3-3.46"/></svg>
      </span>
      <span class="choice-text">
        <span class="choice-title">保護者ホームへ</span>
        <span class="choice-sub">学習状況の確認・本体の設定</span>
      </span>
      <svg class="choice-arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 6 15 12 9 18"/></svg>
    </a>
  </nav>

  <footer class="entry-foot"><span>チームKINDAI(近畿大学)</span></footer>
</div>
<script type="module" src="./viewer.js"></script>
<script type="module" src="./native-entry.js"></script>
</body>
</html>
