<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF0EA">
<title>ててまる こども画面</title>
<link rel="stylesheet" href="styles.css">

<script src="voice.js"></script>
<script type="module" src="./viewer.js"></script>
</head>
<body>
<div class="phone child-bg is-intro" id="childPhone">

  <div class="child-topbar intro-item"><a class="pill-btn" href="trial.html" aria-label="ほごしゃ・こども がめんの きりかえ">きりかえる</a> <span class="quick-mode-label" id="demoLabel" hidden>発表用デモ</span>
    <button class="pill-btn pressable" id="voiceToggle" aria-pressed="true" aria-label="ててまるの声のON/OFF">
      <span class="voice-on">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="4 9 9 9 13 5 13 19 9 15 4 15" fill="currentColor" stroke="none"/><path d="M16 8a5 5 0 0 1 0 8"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
        こえ オン
      </span>
      <span class="voice-off">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="4 9 9 9 13 5 13 19 9 15 4 15" fill="currentColor" stroke="none"/><line x1="16" y1="8" x2="21" y2="13"/><line x1="21" y1="8" x2="16" y2="13"/></svg>
        こえ オフ
      </span>
    </button>
  </div>

  <main class="content child-content">

    <span class="speech intro-item" id="speech" aria-live="polite">やあ!いっしょに がんばろう!</span>

    <!-- ててまる(3D)を中心に、まわりへUIを広げる -->
    <section class="stage is-collapsed" id="stage" aria-label="ててまる">
      <div class="orbit" aria-hidden="true"></div>

      <plush-pal data-motion="intro" class="tetemaru-btn" id="mainPal"></plush-pal>

      <!-- 左上: なかよし度 -->
      <div id="affinityMeter" class="satellite sat-tl" role="meter" aria-label="ててまるとのなかよし度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="15">
      <svg class="affinity-heart" viewBox="0 0 24 24" width="46" height="46" aria-hidden="true">
        <defs>
          <clipPath id="heartClip"><path d="M12 20C12 20 3 14 3 8.5 3 5 5.5 3 8.5 3 10.5 3 12 4.5 12 6 12 4.5 13.5 3 15.5 3 18.5 3 21 5 21 8.5 21 14 12 20 12 20Z"/></clipPath>
          <linearGradient id="heartWater" x2="0" y2="1" gradientUnits="objectBoundingBox">
            <stop stop-color="#ef8193"/><stop offset="1" stop-color="#c9435a"/>
          </linearGradient>
        </defs>
        <path class="affinity-heart-bg" d="M12 20C12 20 3 14 3 8.5 3 5 5.5 3 8.5 3 10.5 3 12 4.5 12 6 12 4.5 13.5 3 15.5 3 18.5 3 21 5 21 8.5 21 14 12 20 12 20Z"/>
        <g clip-path="url(#heartClip)">
          <g id="affinityWaveGroup" class="affinity-wave-group" style="transform:translateY(15px)">
            <path class="affinity-wave-back" d="M-24 -1.3q3 -2.8 6 0t6 0t6 0t6 0t6 0t6 0t6 0t6 0t6 0t6 0t6 0t6 0v28h-72z"/>
            <path class="affinity-wave-front" d="M-24 0q3 3.6 6 0t6 0t6 0t6 0t6 0t6 0t6 0t6 0t6 0t6 0t6 0t6 0v28h-72z"/>
          </g>
        </g>
        <path class="affinity-heart-line" d="M12 20C12 20 3 14 3 8.5 3 5 5.5 3 8.5 3 10.5 3 12 4.5 12 6 12 4.5 13.5 3 15.5 3 18.5 3 21 5 21 8.5 21 14 12 20 12 20Z"/>
      </svg>
        <span class="sat-value" id="affinityPct">15%</span>
        <span class="sat-label">なかよし度</span>
      </div>

      <!-- 右上: きょうのがんばり -->
      <div class="satellite sat-tr" aria-label="きょうの がくしゅう 0かい">
        <span class="sat-ring" aria-hidden="true"><span></span></span>
        <span class="sat-value">0かい</span>
        <span class="sat-label">がんばり</span>
      </div>

      <!-- 左下: あたたかさ -->
      <button class="satellite sat-bl" id="heatSat" aria-haspopup="dialog" aria-label="ててまるの あたたかさを かえる">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 14.8V4a2 2 0 0 0-4 0v10.8a4 4 0 1 0 4 0z"/><path d="M12 11v6" stroke-width="3"/></svg>
        <span class="sat-value" id="heatSatValue">36ど</span>
        <span class="sat-label">あたたかさ</span>
      </button>

      <!-- 右下: ぎゅっ -->
      <button class="satellite sat-br sat-accent" id="hugBtn" aria-label="ててまるを ぎゅっと する">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 20C12 20 3 14 3 8.5 3 5 5.5 3 8.5 3 10.5 3 12 4.5 12 6 12 4.5 13.5 3 15.5 3 18.5 3 21 5 21 8.5 21 14 12 20 12 20Z"/></svg>
        <span class="sat-value">ぎゅっ</span>
        <span class="sat-label">する</span>
      </button>
    </section>

    <span class="swipe-hint">ててまるを なぞると まわるよ</span>
    <div id="affinityToast" class="affinity-toast" role="status"></div>

    <!-- 今日の目標 -->
    <div class="child-card goal-card intro-item">
      <span class="child-goal-label">きょうの もくひょう</span>
      <div class="child-goal-value"><select id="subject" aria-label="きょうの きょうか"></select> を <select id="goal" aria-label="きょうの めあて"></select></div>
      <button class="start-btn" id="startBtn" disabled>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><polygon points="6 4 20 12 6 20"/></svg>
        <span id="startLabel">勉強モード（タイマー）</span>
      </button>
      <button type="button" class="pill-btn" id="quizBtn" disabled>問題モードで あそぶ</button>
      <button type="button" class="pill-btn" id="nicknameBtn" hidden>よびかたを かえる</button>
    </div>
  </main>

  <!-- あたたかさの調整(下から出るシート) -->
  <div class="sheet" id="heatSheet" hidden>
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="heatTitle">
      <span class="sheet-grip" aria-hidden="true"></span>
      <span class="setting-label-top child-card-title" id="heatTitle">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2c2 3-2 4-1 7 1-1 2-1 3 0 1 2-1 4-3 4-3 0-5-2-5-5 0-3 2-4 2-6 1 1 1 2 1 3z"/><path d="M9 17a3 3 0 0 0 6 0"/></svg>
        ててまるの あたたかさ
      </span>
      <div class="temp-value" id="heatLabel">36ど</div>
      <div class="temp-row">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v20M5 7l14 10M19 7L5 17M2 12h20"/></svg>
        <input id="heat" type="range" min="28" max="40" step="1" value="36" aria-label="ててまるのあたたかさ">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
      </div>
      <button class="sheet-close pressable" data-close>できた</button>
    </div>
  </div>


  <!-- 学習中ロックオーバーレイ -->
  <div class="lock-overlay hidden" id="lockOverlay" role="dialog" aria-modal="true" aria-label="学習ロック中">
    <div class="lock-icon-wrap"><plush-pal data-motion="idle" class="lock-canvas"></plush-pal>
      <span class="lock-badge">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      </span>
    </div>
    <div class="lock-title">がくしゅうロック中</div>
    <div class="lock-sub">この画面で ててまると いっしょに<br>おべんきょうしよう</div>

    <div class="timer" id="timer">00:00</div>
    <div class="lock-progress-track"><div class="lock-progress-fill" id="lockProgressFill"></div></div>
    <div class="lock-goal-label" id="lockGoalLabel">もくひょう:さんすうを 10ぷん</div>

    <div class="allowed-box">
      <button type="button" id="pauseBtn" class="allowed-item pill-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span id="pauseLabel">ひとやすみ</span>
      </button>
    </div>

    <button type="button" class="unlock-btn" id="unlockBtn">
      <span id="unlockLabel">パスワードで おわる</span>
    </button>
  </div>

  <nav class="tabbar child-tabbar intro-item">
    <a class="tab child-tab active" href="child.html" aria-current="page">
      <span class="child-tab-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9"/></svg>
      </span>
      ホーム
    </a>
    <a class="tab child-tab" id="childLogLink" href="study-log.html?role=child">
      <span class="child-tab-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
      </span>
      きろく
    </a>
  </nav>
</div>

<dialog class="flow-sheet" id="flow" aria-labelledby="sheetTitle"><div class="flow-content" id="flowContent"></div></dialog>
<script type="module" src="./child-study.js"></script></body></html>
