<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>ててまる 学習記録</title>
<link rel="stylesheet" href="styles.css">
<script src="data.js"></script><script src="trial-data.js"></script>
</head>
<body>
<div class="phone">

  <header class="header">
    <div class="header-row">
      <div>
        <h1 class="header-title" id="pageTitle">学習記録</h1>
        <span class="header-sub">直近7日間のくわしい記録</span>
      </div>
      <a class="avatar back-btn pressable" href="trial.html" aria-label="メニューへ戻る">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
      </a>
    </div>
  </header>

  <div class="level-picker-row">
    <span class="level-picker-label">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7V4h16v3"/><path d="M9 20h6"/><path d="M12 4v16"/></svg>
      かんじ レベル
    </span>
    <div class="level-picker" id="levelPicker">
      <button class="level-btn" data-level="1">1年</button>
      <button class="level-btn" data-level="2">2年</button>
      <button class="level-btn active" data-level="3">3年</button>
      <button class="level-btn" data-level="6">ぜんぶ</button>
    </div>
  </div>

  <main class="content log-list" id="logList"></main>
</div>

<script>
const SUBJECT_ICON_PATHS = {
  "算数": '<path d="M4 4h16v16H4z"/><path d="M8 8h8M8 12h8M8 16h4"/>',
  "国語": '<path d="M4 19V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v14"/><path d="M4 19a2 2 0 0 0 2 2h14"/><path d="M8 7h8M8 11h8"/>',
  "英語": '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
  "理科": '<path d="M9 2v6l-5 9a2 2 0 0 0 2 3h12a2 2 0 0 0 2-3l-5-9V2"/><path d="M9 2h6"/>',
  "社会": '<circle cx="12" cy="12" r="9"/><path d="M3 10h18M5 15h14M9 3a16 16 0 0 0 0 18M15 3a16 16 0 0 1 0 18"/>',
};

function subjectIconSvg(subject) {
  return `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="${SUBJECT_COLORS[subject]}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${SUBJECT_ICON_PATHS[subject] || ""}</svg>`;
}

document.getElementById("pageTitle").innerHTML = annotateFurigana("学習記録");

// ---- かんじレベル picker ----
const levelPickerEl = document.getElementById("levelPicker");
let currentLevel = getKanjiLevel();
levelPickerEl.querySelectorAll(".level-btn").forEach((btn) => {
  btn.classList.toggle("active", Number(btn.dataset.level) === currentLevel);
  btn.addEventListener("click", () => {
    currentLevel = Number(btn.dataset.level);
    setKanjiLevel(currentLevel);
    levelPickerEl.querySelectorAll(".level-btn").forEach((b) => b.classList.toggle("active", b === btn));
  });
});

const logListEl = document.getElementById("logList");
const openDate = location.hash ? location.hash.slice(1) : null;
const latestDate = WEEK_DETAIL[WEEK_DETAIL.length - 1].date;

WEEK_DETAIL.slice().reverse().forEach((d) => {
  const total = dayTotalMinutes(d);
  const subjectTotals = daySubjectTotals(d);

  const card = document.createElement("div");
  card.className = "card card-flush";
  card.id = "day-" + d.date;

  const head = document.createElement("button");
  head.className = "log-head";
  head.setAttribute("aria-expanded", "false");
  head.innerHTML = `
    <span class="log-head-text">
      <span class="log-date">${d.date.slice(5).replace("-", "/")}(${d.weekday.replace("曜日","")})${d.date === latestDate ? '<span class="log-date-today">さいしん</span>' : ""}</span>
      <span class="log-meta">${annotateFurigana("教材")} ${d.sessions.length}件・${annotateFurigana("休憩")} ${d.breaks.length}回</span>
    </span>
    <span class="log-head-right">
      <span class="log-total">${minLabel(total)}</span>
      <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 6 15 12 9 18"/></svg>
    </span>
  `;

  const bar = document.createElement("div");
  bar.className = "log-bar";
  Object.entries(subjectTotals).filter(([, m]) => m > 0).forEach(([name, m]) => {
    const seg = document.createElement("div");
    seg.style.background = SUBJECT_COLORS[name];
    seg.style.width = (m / total) * 100 + "%";
    bar.appendChild(seg);
  });

  const panel = document.createElement("div");
  panel.className = "accordion-panel";

  const sessionsHtml = d.sessions.map((s) => `
    <div class="log-session">
      <span class="log-icon">${subjectIconSvg(s.subject)}</span>
      <span class="log-session-text">
        <span class="log-session-title">${annotateFurigana(s.subject)}:${annotateFurigana(s.material)}</span>
        <span class="log-session-sub">${s.pages ? s.pages+"ページ・" : ""}${s.start}〜${s.end}(${minLabel(sessionMinutes(s))})</span>
      </span>
    </div>
  `).join("");

  const breaksHtml = d.breaks.length ? `
    <div class="log-breaks">
      ${d.breaks.map((b) => `
        <div class="log-break">
          <span class="log-icon log-icon-rest">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 8h1a4 4 0 0 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4z"/><path d="M6 2v3M10 2v3M14 2v3"/></svg>
          </span>
          <span class="log-break-name">${annotateFurigana("休憩")}:${b.reason}</span>
          <span class="log-break-time">${b.start}〜${b.end}(${b.minutes}分)</span>
        </div>
      `).join("")}
    </div>
  ` : "";

  const emptyHtml = d.sessions.length === 0 ? `<div class="log-empty">この日の${annotateFurigana("学習記録")}はありません</div>` : "";

  panel.innerHTML = `<div class="log-body">${sessionsHtml}${emptyHtml}${breaksHtml}</div>`;

  function setOpen(v) {
    card.classList.toggle("is-open", v);
    head.setAttribute("aria-expanded", String(v));
    panel.style.maxHeight = v ? panel.scrollHeight + 40 + "px" : "0";
  }
  head.addEventListener("click", () => setOpen(!card.classList.contains("is-open")));

  card.appendChild(head);
  card.appendChild(bar);
  card.appendChild(panel);
  logListEl.appendChild(card);

  if (d.date === openDate) requestAnimationFrame(() => setOpen(true));
});

if (openDate) {
  const target = document.getElementById("day-" + openDate);
  if (target) setTimeout(() => target.scrollIntoView({ behavior: "smooth", block: "start" }), 150);
}

applyKanjiLevel(currentLevel);
</script>
</body>
</html>
