<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>ててまる 学習記録</title>
<link rel="stylesheet" href="styles.css">
<style>
.log-session-text { min-width:0; overflow-wrap:anywhere; }
.log-session-sub { white-space:pre-line; }
.log-filter { display:flex; gap:12px; align-items:center; padding:8px 18px; font-size:13px; }
.log-filter[hidden]{display:none}
.log-filter select { flex:1; min-width:0; padding:8px; border-radius:8px; border:1px solid var(--line); background:white; color:inherit; font:inherit; }
</style>
<script src="data.js"></script>
</head>
<body>
<div class="phone">

  <header class="header">
    <div class="header-row">
      <div>
        <h1 class="header-title" id="pageTitle">学習記録</h1>
        <span class="header-sub">日ごとのくわしい記録</span>
      </div>
      <a class="avatar back-btn pressable" id="backToRole" href="trial.html" aria-label="もどる">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
      </a>
    </div>
  </header>

  <div class="level-picker-row">
    <span class="level-picker-label">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7V4h16v3"/><path d="M9 20h6"/><path d="M12 4v16"/></svg>
      かんじ レベル
    </span>
    <div class="level-picker" id="levelPicker">
      <button class="level-btn" data-level="1">1年</button>
      <button class="level-btn" data-level="2">2年</button>
      <button class="level-btn active" data-level="3">3年</button>
      <button class="level-btn" data-level="6">ぜんぶ</button>
    </div>
  </div>

  <label class="log-filter" id="filterRow" hidden>教材
    <select id="materialFilter" aria-label="教材で記録をしぼる"></select>
  </label>
  <main class="content log-list" id="logList"></main>
</div>

<script type="module" src="zip-log.js"></script>
</body>
</html>
